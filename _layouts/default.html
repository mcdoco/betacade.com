<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0c0c0e" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}" />
  <link rel="canonical" href="{{ page.url | absolute_url }}" />
  <meta property="og:title" content="{{ page.title | default: site.title }}" />
  <meta property="og:description" content="{{ page.description | default: site.description }}" />
  <meta property="og:url" content="{{ page.url | absolute_url }}" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="{{ site.title }}" />
  <meta property="og:image" content="{{ '/og-image.png' | absolute_url }}" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Betacade: playtest your web game." />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="{{ '/og-image.png' | absolute_url }}" />
  <link rel="stylesheet" href="/assets/css/site.css" />
</head>
<body>
  {%- comment -%}
  No scripts, analytics, trackers or cookies on this site. The privacy policy
  says so (privacy.html, "This website"); keep it true.
  {%- endcomment -%}

  {% include nav.html %}

  {{ content }}

  {% include footer.html %}
  {% include studio-dialog.html %}
  {% include analytics.html %}

</body>
</html>
