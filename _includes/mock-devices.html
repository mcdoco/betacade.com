<figure class="devices" role="img" aria-label="The same game playing in a browser window, on a phone and on a smart fridge">
  <div class="d-browser">
    <div class="bw-bar" aria-hidden="true"><span class="bw-dots"><i></i><i></i><i></i></span><span class="bw-url">play.betacade.com/g/moon-toads</span></div>
    <div class="d-playbar" aria-hidden="true"><span>Moon Toads · build 14</span><span class="d-chip">Feedback</span><span class="d-chip">Pause</span></div>
    <div class="d-screen">{% include mock-game.html %}</div>
  </div>
  <div class="d-phone" aria-hidden="true"><span class="d-island"></span><div class="d-phone-screen">{% include mock-game.html %}</div><span class="d-home"></span></div>
  <div class="d-fridge" aria-hidden="true">
    <div class="d-fridge-door left"><span class="d-handle"></span></div>
    <div class="d-fridge-door right">
      <span class="d-handle"></span>
      <div class="d-fridge-screen">{% include mock-game.html %}</div>
    </div>
  </div>
</figure>
