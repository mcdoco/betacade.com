<h2>What you see after a playtest</h2>
<ul>
  <li>Who played, for how long, and on what screen</li>
  <li>How far each player got, read from the game's saves</li>
  <li>Errors, with the build they happened on</li>
  <li>Feedback from the pause menu, which you can reply to</li>
  <li>Replays of each session, once saves and replays are on</li>
</ul>
